server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Used so the Explainer Studio upstream is resolved per request: if that container is
    # stopped or not built, only /explainer-* returns 502 - nginx itself (and the whole app) still starts.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $explainer_upstream http://explainer-studio:4000;

    # Angular SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST + SSE to the backend service. SSE needs buffering off and a
    # long read timeout so the Production Dashboard keeps receiving progress.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        # nginx defaults to a 1 MB request body and returns 413 before the
        # request ever reaches Spring - so the backend's own 512 MB multipart
        # limit is unreachable without raising this too. Must be >= the
        # VIDEO_EDITOR_MAX_UPLOAD_MB the backend is configured with.
        client_max_body_size 2048m;
        # Don't spool a multi-hundred-MB upload to disk before forwarding it;
        # stream it straight through to the backend instead.
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Explainer Studio API (REST + SSE log stream). /explainer-api/x -> explainer-studio:4000/api/x
    location /explainer-api/ {
        rewrite ^/explainer-api/(.*)$ /api/$1 break;
        proxy_pass $explainer_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Finished explainer videos, thumbnails and captions (range requests pass through so <video> can seek).
    location /explainer-media/ {
        rewrite ^/explainer-media/(.*)$ /media/$1 break;
        proxy_pass $explainer_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
