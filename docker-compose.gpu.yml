# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Requires: an NVIDIA driver on the host new enough for CUDA 12.4, and (on
# Windows) Docker Desktop running on the WSL2 backend. Check with:
#   docker run --rm --gpus all nvidia/cuda:12.4.0-base-ubuntu22.04 nvidia-smi
#
# Target: 16 GB NVIDIA card. Qwen Image 2.1 (images), Wan 2.2 TI2V-5B / I2V-A14B
# and MiniMax H3 (video). ComfyUI offloads weights to system RAM when needed,
# so 64 GB host RAM is recommended for the 14B / H3 video paths.

services:
  tts-indic:
    environment:
      INDICF5_DEVICE: ${INDICF5_DEVICE:-cuda}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  tts-chatterbox:
    build:
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu128
        TORCH_PACKAGES: "torch==2.7.1 torchaudio==2.7.1"
    environment:
      CHATTERBOX_DEVICE: ${CHATTERBOX_DEVICE:-cuda}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  tts-cosyvoice:
    build:
      args:
        COSYVOICE_GPU: "1"
    environment:
      COSYVOICE_DEVICE: ${COSYVOICE_DEVICE:-cuda}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Ollama intentionally runs on the host for this project. Keep the bundled
  # GPU Ollama service disabled; .env uses host.docker.internal:11434.
  # ollama:
  #   image: ollama/ollama:latest
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

  comfyui:
    # cu124-slim is a retired tag. Its runner script git-clones ComfyUI at HEAD,
    # so it pairs a current ComfyUI (which needs comfy_aimdo, blake3, etc.)
    # with a Python environment frozen in 2024, and main.py dies on:
    #   ModuleNotFoundError: No module named 'comfy_aimdo'
    # Use a maintained tag so the bundled dependencies match the ComfyUI it
    # pulls. cu128 covers Turing (MX450/GTX 16xx) through Blackwell.
    image: ${COMFYUI_GPU_IMAGE:-yanwk/comfyui-boot:cu128-slim}

    environment:
      # Overrides the base file's "--cpu": no --cpu here, and previews are
      # cheap on a GPU. Extra flags still come from COMFYUI_EXTRA_CLI_ARGS.
      #
      # ON A 2-4 GB CARD, set this in .env:
      #   COMFYUI_EXTRA_CLI_ARGS=--lowvram
      # --lowvram keeps only the block being computed resident and swaps the
      # rest to system RAM. It costs some speed but is what makes SD1.5 fit at
      # all below ~4 GB. Use --novram if --lowvram still OOMs.
      CLI_ARGS: ${COMFYUI_EXTRA_CLI_ARGS:-}
      # GPU generation still offloads some work to CPU on small cards. An empty
      # OMP_NUM_THREADS is invalid to libgomp and produces:
      #   libgomp: Invalid value for environment variable OMP_NUM_THREADS
      # Keep a small explicit value instead of exporting an empty string.
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-4}
      # pre-start.sh: download Qwen Image 2.1 files on first start.
      DOWNLOAD_16GB_IMAGE_MODELS: ${DOWNLOAD_16GB_IMAGE_MODELS:-true}
    # The :cpu image ships ComfyUI inside the image. The :cu124-slim image does
    # NOT - it git-clones ComfyUI into /root on first start. Inheriting the base
    # file's volumes would pre-create /root/ComfyUI/models and /root/ComfyUI/output,
    # and git refuses to clone into a non-empty directory:
    #   fatal: destination path 'ComfyUI' already exists and is not an empty directory
    #   /runner-scripts/download.sh: cd: /root/ComfyUI/custom_nodes: No such file or directory
    # So this REPLACES the volume list (!override) with a single empty volume at
    # /root, which is the layout these images expect.
    #
    # Consequence: the GPU stack has its own model store, separate from the CPU
    # stack's comfyui-data volume. Download checkpoints again AFTER ComfyUI has
    # started once and finished its first-run setup:
    #   ./download-models.sh   (see MODELS.md)
    volumes: !override
      - comfyui-gpu-root:/root
      # Runs after the ComfyUI bundle is copied into /root and before the
      # server starts. Installs ComfyUI-VideoHelperSuite and (optionally) downloads
      # the Qwen Image 2.1 files, so a fresh GPU volume works out of the box.
      - ./comfyui-gpu/pre-start.sh:/root/user-scripts/pre-start.sh
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Image/video model settings come from .env. Only timeouts change here.
  backend:
    environment:
      COMFYUI_TIMEOUT_SECONDS: ${COMFYUI_TIMEOUT_SECONDS:-900}
      COMFYUI_QUEUE_WAIT_SECONDS: ${COMFYUI_QUEUE_WAIT_SECONDS:-1800}
      # eclipse-temurin (backend's base image) is a plain JRE image, not built
      # from nvidia/cuda like comfyui/ollama are - those bake this var in
      # already, which is what makes the NVIDIA runtime hook actually mount
      # nvidia-smi + driver libs into a container, not just the raw devices.
      # Without it here, `deploy.resources.reservations.devices` below still
      # attaches the GPU device but nvidia-smi itself never gets mounted.
      NVIDIA_DRIVER_CAPABILITIES: utility
    # Backend never runs inference itself (ComfyUI does that) - this is ONLY
    # so ResourceMonitorService's `nvidia-smi` check (used by the
    # LOCAL_AI_ANIMATION_MIN_VRAM_MB gate) can actually see the GPU. Without
    # this, the backend container has no GPU passthrough at all and the gate
    # reports "No GPU detected" on every server, regardless of real hardware.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  comfyui-gpu-root:
    name: ${COMFYUI_GPU_VOLUME:-ai-story-studio_comfyui-gpu-root}
