# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Requires: an NVIDIA driver on the host that supports CUDA 13.0 (driver 580+, the
# ComfyUI image is PyTorch cu130), plus the NVIDIA Container Toolkit. Check with:
#   docker run --rm --gpus all nvidia/cuda:13.0.0-base-ubuntu24.04 nvidia-smi
# Validate the merged ComfyUI image/GPU config without starting anything:
#   scripts/validate-comfyui-config.sh
#
# Target: 16 GB NVIDIA card. Qwen Image 2.1 (images), Wan 2.2 TI2V-5B / I2V-A14B
# and MiniMax H3 (video). ComfyUI offloads weights to system RAM when needed,
# so 64 GB host RAM is recommended for the 14B / H3 video paths.

services:
  tts-chatterbox:
    build:
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu128
        TORCH_PACKAGES: "torch==2.7.1 torchaudio==2.7.1"
    environment:
      CHATTERBOX_DEVICE: ${CHATTERBOX_DEVICE:-cuda}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  tts-indic:
    environment:
      INDICF5_DEVICE: ${INDICF5_DEVICE:-cuda}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  tts-cosyvoice:
    build:
      args:
        COSYVOICE_GPU: "1"
    environment:
      COSYVOICE_DEVICE: ${COSYVOICE_DEVICE:-cuda}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Ollama intentionally runs on the host for this project. Keep the bundled
  # GPU Ollama service disabled; .env uses host.docker.internal:11434.
  # ollama:
  #   image: ollama/ollama:latest
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

  tts-rumik:
    environment:
      RUMIK_DEVICE: ${RUMIK_DEVICE:-cuda}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  comfyui:
    # RTX 5060 Ti (Blackwell) / CUDA 13.0 ComfyUI image (PyTorch 2.13+cu130).
    # MUST match docker-compose.yml. This override file would otherwise win and
    # silently downgrade the image (it used to default to cu128-slim).
    # Single source of truth: COMFYUI_GPU_IMAGE in .env.
    # Validate with: scripts/validate-comfyui-config.sh
    image: ${COMFYUI_GPU_IMAGE:-yanwk/comfyui-boot:cu130-slim-v2}
    gpus: !override all
    environment:
      # Same as the base file; no --cpu. Extra flags come from COMFYUI_EXTRA_CLI_ARGS
      # (empty by default). Only add flags for a proven runtime failure, e.g. if
      # Qwen sampling dies with "No operator found for memory_efficient_attention",
      # set COMFYUI_EXTRA_CLI_ARGS=--use-pytorch-cross-attention --disable-xformers
      CLI_ARGS: --preview-method none ${COMFYUI_EXTRA_CLI_ARGS:-}
    # Volumes (comfyui-gpu-root:/root + pre-start.sh) are inherited from
    # docker-compose.yml; the existing model volume is reused as-is.

  # Image/video model settings come from .env. Only timeouts change here.
  backend:
    environment:
      COMFYUI_TIMEOUT_SECONDS: ${COMFYUI_TIMEOUT_SECONDS:-900}
      COMFYUI_QUEUE_WAIT_SECONDS: ${COMFYUI_QUEUE_WAIT_SECONDS:-1800}
      # eclipse-temurin (backend's base image) is a plain JRE image, not built
      # from nvidia/cuda like comfyui/ollama are - those bake this var in
      # already, which is what makes the NVIDIA runtime hook actually mount
      # nvidia-smi + driver libs into a container, not just the raw devices.
      # Without it here, `deploy.resources.reservations.devices` below still
      # attaches the GPU device but nvidia-smi itself never gets mounted.
      NVIDIA_DRIVER_CAPABILITIES: utility
    # Backend never runs inference itself (ComfyUI does that) - this is ONLY
    # so ResourceMonitorService's `nvidia-smi` check (used by the
    # LOCAL_AI_ANIMATION_MIN_VRAM_MB gate) can actually see the GPU. Without
    # this, the backend container has no GPU passthrough at all and the gate
    # reports "No GPU detected" on every server, regardless of real hardware.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

