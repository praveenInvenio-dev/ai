server:
  port: 8080

spring:
  application:
    name: ai-story-studio
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ai_story_studio}
    username: ${DB_USER:studio}
    password: ${DB_PASSWORD:studio}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Must exceed studio.video-editor.max-upload-mb, or Spring rejects the
      # upload before our own size check runs and the user gets a generic 500
      # instead of the message naming the actual limit. The old 25 MB ceiling
      # predates the video editor and would reject almost any real clip.
      max-file-size: ${VIDEO_EDITOR_MAX_UPLOAD_MB:512}MB
      max-request-size: ${VIDEO_EDITOR_MAX_REQUEST_MB:2048}MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

studio:
  demoMode: ${DEMO_MODE:false}
  # Spec section 34: when true, no external network call is allowed from
  # this app. Real enforcement, not just a label - see ProviderGateway
  # (Sarvam TTS refused), CloudAIAnimationProvider (refused), and
  # tts/server.py (Edge TTS refused). Ollama/ComfyUI/Piper/FFmpeg/animation
  # are already local regardless of this flag, so it only ever has
  # something to actually disable.
  offlineMode: ${OFFLINE_MODE:false}
  storage:
    root: ${STORAGE_ROOT:/data/projects}
  vision:
    # mock is zero-cost/no-op; set VISION_PROVIDER=ollama and VISION_MODEL to a
    # vision-capable Ollama model to enable semantic image QA and automatic retry.
    provider: ${VISION_PROVIDER:mock}
    model: ${VISION_MODEL:llava:latest}
  ollama:
    # Fallback used only if OLLAMA_BASE_URL isn't set in the environment at all.
    # Matches docker-compose.yml's default: your machine's Ollama, not a bundled
    # container (which would be http://ollama:11434 and only exists if you start
    # it with `docker compose --profile bundled-ollama up -d`).
    baseUrl: ${OLLAMA_BASE_URL:http://host.docker.internal:11434}
    model: ${OLLAMA_MODEL:llama3.1}
    timeoutSeconds: ${OLLAMA_TIMEOUT_SECONDS:120}
  comfyui:
    baseUrl: ${COMFYUI_BASE_URL:http://comfyui:8188}
    # Single image engine: Qwen Image 2.1 (workflows qwen-image-2-1-16gb-t2i/-ref/-ref-dual).
    # Locked character references are passed natively; no SDXL/IPAdapter path.
    qwen:
      diffusion-model: ${COMFYUI_QWEN_DIFFUSION_MODEL:qwen_image_2.1_int8_convrot.safetensors}
      text-encoder: ${COMFYUI_QWEN_TEXT_ENCODER:qwen3vl_8b_int8_convrot.safetensors}
      vae: ${COMFYUI_QWEN_VAE:qwen_image_2.1_vae_bf16.safetensors}
      upscale-model: ${COMFYUI_QWEN_UPSCALE_MODEL:RealESRGAN_x2.pth}
      # Base generation size (~1 MP, 9:16), steps, reference resize budget.
      width: ${COMFYUI_QWEN_WIDTH:768}
      height: ${COMFYUI_QWEN_HEIGHT:1344}
      steps: ${COMFYUI_QWEN_STEPS:30}
      resolution: ${COMFYUI_QWEN_RESOLUTION:1024}
      # Final size after RealESRGAN x2 + resize.
      output-width: ${COMFYUI_QWEN_OUTPUT_WIDTH:1080}
      output-height: ${COMFYUI_QWEN_OUTPUT_HEIGHT:1920}
    # Wall-clock budget for ONE image. On expiry the prompt is interrupted and
    # removed from ComfyUI's queue, so it stops eating CPU the next scene needs.
    timeoutSeconds: ${COMFYUI_TIMEOUT_SECONDS:900}
    # How long a caller will wait for its turn when another scene is generating.
    # ComfyUI runs one prompt at a time, so the backend queues callers itself
    # rather than stacking prompts that will all time out together.
    queueWaitSeconds: ${COMFYUI_QUEUE_WAIT_SECONDS:3600}
    pollIntervalMs: ${COMFYUI_POLL_INTERVAL_MS:2000}
    # When ComfyUI fails or times out, fall back to a placeholder image so the
    # rest of the pipeline (audio, video, packaging) still completes. Set false
    # to fail the job loudly instead of silently shipping placeholders.
    fallbackToPlaceholder: ${COMFYUI_FALLBACK_PLACEHOLDER:false}
  tts:
    # piper       = fully offline, free, but no Kannada / Indian English / child voices
    # sarvam      = hosted API, costs per character, covers all of the above
    # chatterbox  = expressive English (paralinguistic tags, voice cloning) - see
    #               tts-chatterbox/server.py. Requires the `chatterbox` compose profile.
    provider: ${TTS_PROVIDER:piper}
    baseUrl: ${TTS_BASE_URL:http://tts:5002}
    voice: ${TTS_VOICE:edge:en-IN-NeerjaNeural}
    sarvam:
      baseUrl: ${SARVAM_BASE_URL:https://api.sarvam.ai}
      apiKey: ${SARVAM_API_KEY:}
      model: ${SARVAM_MODEL:bulbul:v3}
      # Speaker names are per-language; check Sarvam's recommended speakers for
      # your target language rather than assuming one works everywhere.
      speaker: ${SARVAM_SPEAKER:anushka}
      # kn-IN Kannada, hi-IN Hindi, en-IN Indian English, ta-IN, te-IN, ml-IN, ...
      language: ${SARVAM_LANGUAGE:en-IN}
    chatterbox:
      baseUrl: ${CHATTERBOX_TTS_BASE_URL:http://tts-chatterbox:5004}
      # Must match a reference clip filename (minus .wav) in
      # tts-chatterbox/voices/ - see that folder's README. No default ships
      # bundled, unlike Piper's preloaded voices, since cloning needs a real
      # reference clip someone actually has rights to use.
      voice: ${CHATTERBOX_VOICE:narrator}
    cosyvoice:
      baseUrl: ${COSYVOICE_TTS_BASE_URL:http://tts-cosyvoice:5005}
      voice: ${COSYVOICE_VOICE:default}
  ffmpeg:
    binary: ${FFMPEG_BIN:ffmpeg}
  retry:
    llm: 3
    image: 2
    tts: 2
    ffmpeg: 1
  quality:
    minScore: ${QUALITY_MIN_SCORE:70}
    imageValidation:
      # Semantic QA is automatically used when studio.vision.provider=ollama.
      # With the default mock provider only the cheap image-integrity checks run.
      enabled: ${IMAGE_VALIDATION_ENABLED:true}
      maxRetries: ${IMAGE_VALIDATION_RETRIES:1}
      characterReferenceRequiredForHero: ${CHARACTER_REFERENCE_REQUIRED_FOR_HERO:true}
  video:
    # vertical = 1080x1920 (Shorts/Reels, matches 9:16 scene images); horizontal = 1920x1080.
    orientation: ${VIDEO_ORIENTATION:vertical}
    transitions:
      # Disabled by default for correctness on low-memory machines. The renderer
      # can opt in and automatically falls back to full-length concat if a
      # transition graph ever shortens the timeline.
      enabled: ${VIDEO_TRANSITIONS_ENABLED:false}
  music:
    autoEnabled: ${AUTO_MUSIC_ENABLED:true}
  video-editor:
    # false removes the module entirely - no endpoints, no nav item - so editor
    # problems cannot affect the story pipeline.
    enabled: ${VIDEO_EDITOR_ENABLED:true}
    storage-path: ${VIDEO_EDITOR_STORAGE_PATH:/data/video-editor}
    # 1 is a correctness setting on a 12-core/2 GB-VRAM box, not a tuning knob:
    # concurrent x264 encodes alongside a diffusion job make everything slower.
    max-concurrent-renders: ${VIDEO_EDITOR_MAX_CONCURRENT_RENDERS:1}
    max-clips: ${VIDEO_EDITOR_MAX_CLIPS:20}
    max-upload-mb: ${VIDEO_EDITOR_MAX_UPLOAD_MB:512}
    # 480, not the 720 in the brief: ~2.5x faster to encode on this CPU and
    # adequate for judging cuts, which is all a preview is for.
    preview-resolution: ${VIDEO_EDITOR_PREVIEW_RESOLUTION:480}
    default-resolution: ${VIDEO_EDITOR_DEFAULT_RESOLUTION:1080}
    x264-preset: ${VIDEO_EDITOR_X264_PRESET:veryfast}
    crf: ${VIDEO_EDITOR_CRF:23}
    analysis-threads: ${VIDEO_ANALYSIS_THREADS:8}
    worker-base-url: ${VIDEO_WORKER_BASE_URL:http://video-worker:5010}
    preview-retention-hours: ${VIDEO_EDITOR_PREVIEW_RETENTION_HOURS:24}
  # Standalone "Video generation" page (VideoGenerationController) - animates
  # one uploaded image via the same Wan/ComfyUI provider the story pipeline
  # uses (studio.animation.local-ai below), independent of any episode.
  # Jobs and their result clips are kept in memory/disk only for this long;
  # see VideoGenJobStore.cleanup().
  video-sequence:
    # how long a finished scene sequence (keyframes, clips, merged video) is kept
    retention-hours: ${VIDEO_SEQUENCE_RETENTION_HOURS:24}
  video-generation:
    retention-hours: ${VIDEO_GENERATION_RETENTION_HOURS:24}
  animation:
    # Priority for animating a story scene: local AI I2V, then cloud I2V,
    # then the always-available 2.5D engine (FFmpeg camera motion + parallax
    # + particles). Both AI tiers are unconfigured by default - reporting
    # "unavailable" honestly rather than pretending to run a model that
    # isn't there - so every scene renders via 2.5D until one is actually
    # set up. See AnimationDecisionService.
    local-ai:
      # Real by default now (see ComfyUIVideoProvider) - deploy this on
      # separate, higher-VRAM hardware and set all of the model filenames
      # below to actually turn it on. Every field left blank keeps this
      # tier honestly "unavailable" (see ComfyUIVideoProvider.unavailableReason)
      # rather than half-configuring a workflow that would fail at render time.
      enabled: ${LOCAL_AI_ANIMATION_ENABLED:false}
      # Story pipeline vs standalone Video Generation page are gated separately.
      # H3 is designed to be the image-first story renderer on the dedicated
      # 16GB deployment; individual scene failures still fall back to 2.5D.
      enabled-in-story-pipeline: ${LOCAL_AI_ANIMATION_ENABLED_IN_STORY_PIPELINE:false}
      # When true, every eligible story scene uses MiniMax H3 I2V instead of
      # only IMPORTANT/HERO scenes. This is the recommended mode for the
      # image-first storyboard workflow on the 16GB H3 server.
      h3-for-all-scenes: ${LOCAL_AI_ANIMATION_H3_FOR_ALL_SCENES:false}
      workflow: ${LOCAL_AI_ANIMATION_WORKFLOW:minimax-h3-image-to-video}
      # Separate native ComfyUI MiniMax H3 workflow. Set this to an API-format workflow exported from ComfyUI.
      minimax-h3-workflow: ${LOCAL_AI_ANIMATION_MINIMAX_H3_WORKFLOW:minimax-h3-reference-to-video}
      minimax-h3-diffusion-model: ${LOCAL_AI_ANIMATION_MINIMAX_H3_MODEL:}
      minimax-h3-ref2va-diffusion-model: ${LOCAL_AI_ANIMATION_MINIMAX_H3_REF2VA_MODEL:}
      minimax-h3-text-encoder: ${LOCAL_AI_ANIMATION_MINIMAX_H3_TEXT_ENCODER:qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors}
      minimax-h3-video-vae: ${LOCAL_AI_ANIMATION_MINIMAX_H3_VIDEO_VAE:minimax_h3_video_vae_fp16.safetensors}
      minimax-h3-audio-vae: ${LOCAL_AI_ANIMATION_MINIMAX_H3_AUDIO_VAE:minimax_h3_audio_vae_fp32.safetensors}
      minimax-h3-steps: ${LOCAL_AI_ANIMATION_MINIMAX_H3_STEPS:0}
      # Wan 2.2 TI2V-5B diffusion model, umt5 text encoder and wan2.2_vae.
      # See MODELS.md for exact filenames.
      diffusion-model: ${LOCAL_AI_ANIMATION_MODEL:}
      clip-model: ${LOCAL_AI_ANIMATION_CLIP_MODEL:}
      vae-model: ${LOCAL_AI_ANIMATION_VAE_MODEL:}
      width: ${LOCAL_AI_ANIMATION_WIDTH:704}
      height: ${LOCAL_AI_ANIMATION_HEIGHT:1280}
      fps: ${LOCAL_AI_ANIMATION_FPS:24}
      steps: ${LOCAL_AI_ANIMATION_STEPS:30}
      cfg: ${LOCAL_AI_ANIMATION_CFG:5.0}
      sampler: ${LOCAL_AI_ANIMATION_SAMPLER:uni_pc}
      scheduler: ${LOCAL_AI_ANIMATION_SCHEDULER:simple}
      # A single Wan call above this length starts costing minutes per scene
      # even on strong hardware - kept modest by default; raise it once
      # you've verified timing on your actual deployment GPU.
      max-duration-seconds: ${LOCAL_AI_ANIMATION_MAX_DURATION_SECONDS:5.0}
      timeout-seconds: ${LOCAL_AI_ANIMATION_TIMEOUT_SECONDS:1800}
      queue-wait-seconds: ${LOCAL_AI_ANIMATION_QUEUE_WAIT_SECONDS:3600}
      max-concurrent: ${LOCAL_AI_ANIMATION_MAX_CONCURRENT:1}
      # Real gate (spec section 25/27), not assumed: below this, AI video
      # stays unavailable regardless of every other setting above - a scene
      # attempted with too little VRAM OOMs mid-run rather than failing
      # fast. 4000 is conservative for a small Wan quant; raise/lower to
      # match whatever you actually deploy on.
      min-vram-mb: ${LOCAL_AI_ANIMATION_MIN_VRAM_MB:14000}
      minimax-h3-min-vram-mb: ${LOCAL_AI_ANIMATION_MINIMAX_H3_MIN_VRAM_MB:0}
      # H3 hardware profile. 16gb = pruned w6a8 DiT + ComfyUI weight offload,
      # 480x832, <=10s, 20 steps for QUALITY / 10 steps for FAST story renders,
      # VRAM floor 15000MB, host RAM floor 48000MB.
      # 24gb = pruned INT8 DiT, VRAM floor 24000MB (old behaviour).
      # Blank/0 values above and below = "use the profile default".
      minimax-h3-profile: ${LOCAL_AI_ANIMATION_MINIMAX_H3_PROFILE:16gb}
      minimax-h3-min-ram-mb: ${LOCAL_AI_ANIMATION_MINIMAX_H3_MIN_RAM_MB:-1}
      minimax-h3-width: ${LOCAL_AI_ANIMATION_MINIMAX_H3_WIDTH:0}
      minimax-h3-height: ${LOCAL_AI_ANIMATION_MINIMAX_H3_HEIGHT:0}
      minimax-h3-max-duration-seconds: ${LOCAL_AI_ANIMATION_MINIMAX_H3_MAX_DURATION_SECONDS:0}
      # Long story scenes are composed from these continuous visual shots; the scene/TTS duration is never capped here.
      minimax-h3-shot-seconds: ${LOCAL_AI_ANIMATION_MINIMAX_H3_SHOT_SECONDS:8.0}
      # Story production uses the saved TTS WAV as the authoritative audio track.
      # H3 native speech is not used for story narration, avoiding multilingual
      # pronunciation errors and preventing H3 from truncating long dialogue.
      minimax-h3-free-vram-before-run: ${LOCAL_AI_ANIMATION_MINIMAX_H3_FREE_VRAM:true}
      # Wan 2.2 I2V-A14B (two 14B fp8 experts, ComfyUI offloads one while the
      # other samples). Image-to-video only. Select per job ("WAN_2_2_14B") or
      # for the story pipeline with LOCAL_AI_ANIMATION_WORKFLOW=wan22-i2v-a14b.
      a14b:
        high-noise-model: ${WAN14B_HIGH_NOISE_MODEL:wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors}
        low-noise-model: ${WAN14B_LOW_NOISE_MODEL:wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors}
        vae: ${WAN14B_VAE:wan_2.1_vae.safetensors}
        width: ${WAN14B_WIDTH:480}
        height: ${WAN14B_HEIGHT:832}
        fps: ${WAN14B_FPS:16}
        steps: ${WAN14B_STEPS:20}
        cfg: ${WAN14B_CFG:3.5}
        shift: ${WAN14B_SHIFT:5.0}
        max-duration-seconds: ${WAN14B_MAX_DURATION_SECONDS:5.0}
        lightning: ${WAN14B_LIGHTNING:false}
        lora-high: ${WAN14B_LORA_HIGH:wan2.2_i2v_lightx2v_4steps_lora_v1_high_noise.safetensors}
        lora-low: ${WAN14B_LORA_LOW:wan2.2_i2v_lightx2v_4steps_lora_v1_low_noise.safetensors}
        min-vram-mb: ${WAN14B_MIN_VRAM_MB:15000}
    cloud:
      # Empty by default = "no cloud provider configured". Never assumed
      # present; set both to opt in once a real provider is wired up.
      api-url: ${CLOUD_ANIMATION_API_URL:}
      api-key: ${CLOUD_ANIMATION_API_KEY:}
    # HERO scenes over this length are too long for a first-pass local/cloud
    # I2V budget on constrained hardware, so they stay on 2.5D regardless of
    # what's configured - a five-minute hero shot is not what "hero shot"
    # (spec section 21) is for.
    max-ai-scene-seconds: ${ANIMATION_MAX_AI_SCENE_SECONDS:12}
    depth-model:
      # Spec section 8. False by default, honestly - no lightweight depth
      # model is actually wired in (FFmpegProcessor.depthModelAvailable()
      # always reports false regardless of this flag until a real
      # estimator exists). Exists as the config surface for when one is.
      enabled: ${ANIMATION_DEPTH_MODEL_ENABLED:false}

logging:
  level:
    com.aistorystudio: INFO
